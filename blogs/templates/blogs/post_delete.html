{% extends "_base.html" %}
{% block title %}Post Delete{% endblock title %}
{% block content %}
    <div class="container mt-4">
        <div class="row">
            <div class="col-9">

                <div class="card shadow my-3 p-5">
                    <h1>Are you sure?</h1>
                    <p class="mt-2">Are you sure you want to delete permanently {{ post.title }} post</p>
                    <form action="" method="POST">
                        {% csrf_token %}
                        <input class="btn btn-danger" type="submit" value="Yes, Delete">
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
